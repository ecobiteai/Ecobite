<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F1E7">
  <title>Email confirmed — EcoBite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <style>
    .confirmed-page{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 15%,rgba(146,194,93,.20),transparent 34%),radial-gradient(circle at 90% 84%,rgba(242,153,74,.16),transparent 35%),var(--paper)}
    .confirmed-card{width:min(100%,620px);padding:clamp(32px,7vw,64px);text-align:center;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.66);box-shadow:0 24px 70px rgba(21,35,26,.10)}
    .confirmed-mark{width:68px;height:68px;margin:0 auto 24px;display:grid;place-items:center;border-radius:50%;background:rgba(114,170,63,.16);font-size:2rem}
    .confirmed-card h1{margin:0 0 14px;font-family:'DM Serif Display',serif;font-size:clamp(2.2rem,7vw,3.8rem);line-height:1;color:var(--ink)}
    .confirmed-card p{max-width:440px;margin:0 auto 18px;color:var(--text-soft);line-height:1.65}
    .confirmed-card .brand{justify-content:center;margin-bottom:42px;color:var(--ink)}
    .confirmed-card .btn{margin:12px auto 0}
  </style>
</head>
<body>
  <main class="confirmed-page">
    <section class="confirmed-card" aria-labelledby="confirmedTitle">
      <a class="brand" href="index.html"><img src="logo-icon.webp" alt=""><span>ecobite</span></a>
      <div class="confirmed-mark" id="confirmedEmoji" aria-hidden="true">🌱</div>
      <h1 id="confirmedTitle">Email confirmed</h1>
      <p id="confirmedMessage">Thank you for joining EcoBite. Your account is ready to help move good food where it is needed.</p>
      <p id="confirmedQuote" style="font-style:italic;color:var(--ink-soft)">“Good food belongs on tables, not in bins.”</p>
      <a class="btn btn-primary" href="home.html">Open my dashboard</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;
      const { data: profile } = await sb.from('profiles').select('full_name, role').eq('id', session.user.id).maybeSingle();
      const name = profile?.full_name || session.user.user_metadata?.full_name || session.user.email?.split('@')[0] || 'friend';
      const welcome = {
        donor: { emoji: '🥕', message: `Thank you, ${name}, for joining EcoBite. Your surplus can become someone’s next good meal.`, quote: '“Every donation turns care into nourishment.”' },
        org: { emoji: '🤝', message: `Thank you, ${name}, for joining EcoBite. You are ready to connect good food with your community.`, quote: '“A stronger community begins at a shared table.”' },
        driver: { emoji: '🚲', message: `Thank you, ${name}, for joining EcoBite. You are ready to help good food reach the people who need it.`, quote: '“A small journey can make a meaningful difference.”' }
      }[profile?.role] || { emoji: '🌱', message: `Thank you, ${name}, for joining EcoBite. Your account is confirmed and ready to help move good food where it is needed.`, quote: '“Good food belongs on tables, not in bins.”' };
      document.getElementById('confirmedEmoji').textContent = welcome.emoji;
      document.getElementById('confirmedMessage').textContent = welcome.message;
      document.getElementById('confirmedQuote').textContent = welcome.quote;
    })();
  </script>
</body>
</html>
